# smartcosting.venoralab.com on the shared host nginx (replaces the Caddy proxy of docker-compose.prod.yml).
# Does what deploy/Caddyfile does: HTTPS, /api/* to the API and the rest to the web app on ONE origin (the sign-in
# cookie must stay first-party), 12 MB uploads, compression, security headers, the client's real IP for the API.
# Ports must match API_HOST_PORT / WEB_HOST_PORT in /opt/smartcosting/.env (4100 / 3100).
# Installed by `sc-admin site-install` from /opt/smartcosting/nginx/ (put there by install.sh).

upstream smartcosting_api { server 127.0.0.1:4100; keepalive 8; }
upstream smartcosting_web { server 127.0.0.1:3100; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    server_name smartcosting.venoralab.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen … ssl http2` works on every nginx version (newer ones only warn and suggest `http2 on;`)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartcosting.venoralab.com;

    ssl_certificate     /etc/letsencrypt/live/smartcosting.venoralab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartcosting.venoralab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:smartcosting_ssl:5m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/smartcosting.access.log;
    error_log  /var/log/nginx/smartcosting.error.log warn;

    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/manifest+json;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location /api/ {
        proxy_pass http://smartcosting_api;
        # PDF and Excel exports can take a while
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://smartcosting_web;
    }
}
