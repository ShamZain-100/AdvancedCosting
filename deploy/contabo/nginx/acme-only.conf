# smartcosting.venoralab.com: TEMPORARY plain-HTTP site, only until the certificate exists (sc-admin site-init → cert),
# then replaced by smartcosting.venoralab.com.conf (sc-admin site-install).
server {
    listen 80;
    listen [::]:80;
    server_name smartcosting.venoralab.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        default_type text/plain;
        return 503 "Smart Costing is being set up. Please try again later.\n";
    }
}
